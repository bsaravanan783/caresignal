name: caresignal CI

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13


      - name: install deps
        run: bun install --frozen-lockfile
      
      - name: run linter
        run: bun run lint
        continue-on-error: true
      
      - name: run tests
        run: bun test
  
  build-and-verify-compose:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: verify docker compose build
        run: docker compose build --no-cache

      - name: start services
        run: docker compose up -d
      
      - name: check container health status
        run: |
          sleep 5
          docker compose ps 
          docker compose logs web
